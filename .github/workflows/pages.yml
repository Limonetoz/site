name: Testar e publicar Jekyll

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build_test:
    name: Build e testes HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js para os testes de tema
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Python para validar imagens e fontes
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Instalar dependências de teste
        run: python3 -m pip install -r tests/requirements.txt

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Compilar Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Testar site compilado por HTTP
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 tests/integration/test_built_site.py _site --base-path "$BASE_PATH"

      - name: Preparar Jekyll para fixtures isoladas
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Testar arquivos Off-topic e Tutorial com e sem artigos
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          gem install jekyll -v 4.4.1 --no-document
          python3 tests/integration/test_off_topic_fixture.py

      - name: Enviar somente o artefato aprovado
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  pages_source:
    name: Validar origem de publicação
    needs: build_test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: read
    steps:
      - name: Exigir GitHub Actions como origem do Pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          endpoint = f"{os.environ['API_URL']}/repos/{os.environ['REPOSITORY']}/pages"
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          try:
              with urlopen(Request(endpoint, headers=headers), timeout=30) as response:
                  pages = json.load(response)
          except HTTPError as error:
              print(f'::error::Não foi possível consultar Pages: HTTP {error.code}')
              sys.exit(1)
          if pages['build_type'] != 'workflow':
              print('::error::Selecione GitHub Actions em Settings > Pages > Source. '
                    'A publicação direta da branch não respeita os testes.')
              sys.exit(1)
          print('PASS: GitHub Pages usa exclusivamente GitHub Actions')
          PY

  deploy:
    name: Publicar após os testes
    needs: [build_test, pages_source]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar artefato aprovado
        id: deployment
        uses: actions/deploy-pages@v5
