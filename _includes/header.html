<header class="header">
  <div class="header-container container">
    <a class="logo" href="{% if page.home %}#inicio{% else %}{{ '/' | relative_url }}{% endif %}" aria-label="Voltar ao início">
      <span class="logo-mark" aria-hidden="true"></span>
      <span class="logo-name">Code4lag_</span>
    </a>

    <nav class="navigation" aria-label="Navegação principal">
      <ul>
        <li>
          <a href="{% unless page.home %}{{ '/' | relative_url }}{% endunless %}#posts">Posts</a>
        </li>
        <li><a href="{{ '/posts/off-topic/' | relative_url }}">Off-topic</a></li>
        <li><a href="{{ '/sobre/' | relative_url }}">Sobre</a></li>
        <li>
          <a
            href="https://github.com/Limonetoz/site"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Repositório do site no GitHub (abre em nova aba)"
          >GitHub</a>
        </li>
        <li><button type="button" id="theme-toggle" class="theme-toggle" hidden>Alternar tema</button></li>
      </ul>
    </nav>
  </div>
</header>
