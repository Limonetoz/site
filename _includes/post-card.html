{% assign post = include.post %}
<article class="post">
  <div class="post-symbol" aria-hidden="true">&gt;</div>
  <div class="post-content">
    <span class="post-category">
      {% include post-categories.html post=post label=include.category %}
    </span>
    <h{{ include.heading_level }}><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h{{ include.heading_level }}>
    <p>{{ post.excerpt | strip_html | strip_newlines | truncate: 160 | escape }}</p>
  </div>
  <div class="post-meta">
    <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%d.%m.%Y" }}</time>
    <a class="post-link" href="{{ post.url | relative_url }}">{{ t.open | escape }} <span aria-hidden="true">→</span></a>
  </div>
</article>
