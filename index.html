<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Blog pessoal sobre estudos, tecnologia e projetos."
  >

  <meta name="theme-color" content="#050505">

  <title>4LagDev // Blog</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Elementos exclusivamente decorativos -->
  <div class="background" aria-hidden="true">
    <span class="shape shape-square"></span>
    <span class="shape shape-circle"></span>
    <span class="shape shape-triangle"></span>
    <span class="shape shape-cross"></span>
  </div>

  <!-- Cabeçalho -->
  <header class="header">
    <div class="header-container container">
      <a class="logo" href="#inicio" aria-label="Voltar ao início">
        <span class="logo-mark" aria-hidden="true"></span>

        <span class="logo-name">
          Code4lag_<span class="logo-muted">
        </span>
      </a>

    </div>
  </header>

  <main>
    <!-- Apresentação -->
    <section class="intro container" id="inicio">
      <!-- Perfil à esquerda -->
      <div class="profile-area">
        <div class="profile-frame" aria-hidden="true"></div>

        <article class="profile-card">
          <div class="profile-image">
            <img
            src="icon.gif">
          </div>

          <div class="profile-info">
            <h2>4LagDev</h2>
            <p>Desenvolvedor</p>
          </div>
        </article>
      </div>

      <!-- Conteúdo à direita -->
      <div class="content">
        <p class="system-label">
          Um arquivo pessoal sobre estudos e artigos
        </p>

        <p class="description">
          Um historico do que ando trabalhando.

        </p>

      </div>
    </section>

  </main>
<footer class="footer">
  <div class="footer-container container">
    <p>© 2026 4LagDev // Site estático</p>

    <nav class="footer-links" aria-label="Links secundários">
      <a href="#inicio">Início</a>
    </nav>
  </div>
</footer>
</body>
</html>
