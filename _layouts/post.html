---
layout: default
---

<main class="post-page container">
  <a class="post-back" href="{{ '/' | relative_url }}#posts">← Voltar aos posts</a>

  <article class="post-entry">
    <header class="post-entry-header">
      {% if page.categories and page.categories != empty %}
        <span class="post-category">{{ page.categories | join: " // " }}</span>
      {% else %}
        <span class="post-category">Post</span>
      {% endif %}

      <h1>{{ page.title }}</h1>

      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%d.%m.%Y" }}
      </time>
    </header>

    <div class="post-entry-content">
      {{ content }}
    </div>
  </article>
</main>
